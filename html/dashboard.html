<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/global.css">
    <title>Dashboard - Finanzas</title>
</head>
<body>
    <header>
        <nav>
            <a href="dashboard.html" class="activo">DASHBOARD</a>
            <a href="ingresos.html">INGRESOS</a>
            <a href="gastos.html">GASTOS</a>
            <a href="simulador.html">SIMULADOR</a>
            <a href="historial.html">HISTORIAL</a>
            <a href="reportes.html">REPORTES</a>
        </nav>
    </header>

    <main>
        <!-- BLOQUE 1: Encabezado -->
        <section>
            <h1>Hola, este es tu resumen financiero</h1>
            <p>Fecha: <time id="fecha">11/08/2026</time></p>
        </section>

        <!-- BLOQUE 2: Tarjetas KPI -->
        <section class="kpis">
            <article>
                <h3>Balance Total</h3>
                <p class="monto positivo" id="balance-total">0</p>
            </article>
            <article>
                <h3>Total Ingresos</h3>
                <p class="monto positivo" id="total-ingresos">0</p>
            </article>
            <article>
                <h3>Total Gastos</h3>
                <p class="monto negativo" id="total-gastos">0</p>
            </article>
        </section>

        <!-- BLOQUE 3: Meta Mensual (Usa la barra nativa <progress>) -->
        <section>
            <h3>Meta Mensual (<span id="meta-porcentaje">75%</span>)</h3>
            <progress id="meta-barra" value="75" max="100"></progress>
        </section>

        <!-- BLOQUE 4: Accesos Rápidos -->
        <section class="acciones">
            <a href="ingresos.html" class="btn btn-positivo">+ Registrar Ingreso</a>
            <a href="gastos.html" class="btn btn-negativo">- Registrar Gasto</a>
            <a href="simulador.html" class="btn btn-primario">Proyectar Ahorro</a>
        </section>
    </main>

    <footer>Powered By Tybo</footer>
    <script src="/javascript/app.js"></script>
</body>
</html>
