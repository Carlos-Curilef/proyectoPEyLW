<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/global.css" />
    <title>Dashboard - Finanzas</title>
  </head>
  <body>
    <header>
      <nav>
        <a href="dashboard.html" class="activo">DASHBOARD</a>
        <a href="ingresos.html">INGRESOS</a>
        <a href="gastos.html">GASTOS</a>
        <a href="simulador.html">SIMULADOR</a>
        <a href="historial.html">HISTORIAL</a>
        <a href="reportes.html">REPORTES</a>
      </nav>
    </header>

    <main>
      <!-- BLOQUE 1: Encabezado -->
      <section>
        <h1>Hola, este es tu resumen financiero</h1>
        <p>Fecha: <time id="fecha">11/08/2026</time></p>
      </section>

      <!-- BLOQUE 2: Tarjetas KPI -->
      <section class="kpis">
        <article>
          <h3>Balance Total</h3>
          <p class="monto positivo" id="balance-total">0</p>
        </article>
        <article>
          <h3>Total Ingresos</h3>
          <p class="monto positivo" id="total-ingresos">0</p>
        </article>
        <article>
          <h3>Total Gastos</h3>
          <p class="monto negativo" id="total-gastos">0</p>
        </article>
      </section>

      <!-- BLOQUE 3: Meta Mensual (Usa la barra nativa <progress>) -->
      <!-- BLOQUE: Meta Mensual de Ahorro -->
      <section>
        <h3>Meta Mensual (<span id="meta-porcentaje">75%</span>)</h3>
        <p>
          Progreso actual: $<span id="meta-actual"></span> de $<span
            id="meta-objetivo"
          ></span>
        </p>
        <article>
          <!-- Barra de progreso nativa (ya estilizada en tu global.css) -->
          <progress id="meta-barra" value="75" max="100"></progress>
        </article>
        <article>
          <!-- Formulario para configurar o eliminar la meta -->
          <form id="form-meta">
            <label>
              <h3>Establecer Nueva Meta ($)</h3>
              <input
                type="number"
                id="input-nueva-meta"
                step="1"
                placeholder="Ej: 1500"
              />
            </label>
            <br />
            <p class="error" data-error-for="monto" aria-live="polite"></p>
            <div class="acciones">
              <button type="submit" class="btn btn-primario">
                Guardar Meta
              </button>
              <!-- BOTÓN AGREGADO PARA BORRAR LA META -->
              <button
                type="button"
                id="btn-limpiar-meta"
                class="btn btn-negativo"
              >
                Limpiar Meta
              </button>
            </div>
          </form>
        </article>
      </section>
    </main>
    <footer class="pie-sitio">
      <p>
        Diseñado por
        <strong
          ><a href="https://github.com/Carlos-Curilef">Cafecito</a></strong
        >
      </p>
      <button
        type="button"
        id="boton-cafe"
        aria-label="Café secreto"
        title="Café secreto"
      >
        ☕
      </button>
    </footer>

    <div id="mostrador" class="mostrador oculto">
      <div class="escena-aroma">
        <div class="contenedor-aroma">
          <span class="aroma a-1"></span>
          <span class="aroma a-2"></span>
          <span class="aroma a-3"></span>
        </div>

        <div class="contenedor-taza">
          <div class="tapa-de-taza"></div>
          <div class="cuerpo-de-taza"></div>
        </div>

        <p class="mensaje-aroma">
          Vale por un café, ¡Suerte con estática 🌱! ☕✨
        </p>
      </div>
    </div>
    <script src="/javascript/app.js"></script>
  </body>
</html>
