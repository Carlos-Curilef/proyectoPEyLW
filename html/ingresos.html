<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/global.css" />
    <title>Registrar Ingreso - Finanzas</title>
  </head>
  <body>
    <header>
      <nav>
        <a href="dashboard.html">DASHBOARD</a>
        <a href="ingresos.html" class="activo">INGRESOS</a>
        <a href="gastos.html">GASTOS</a>
        <a href="simulador.html">SIMULADOR</a>
        <a href="historial.html">HISTORIAL</a>
        <a href="reportes.html">REPORTES</a>
      </nav>
    </header>

    <main>
      <section>
        <h1>Registrar Nuevo Ingreso</h1>
        <p>Ingresa los detalles del monto recibido.</p>

        <form id="form-ingreso">
          <label>
            Monto ($)
            <input
              type="number"
              id="monto"
              name="monto"
              step="1"
              placeholder="0.00"
            />
            <p class="error" data-error-for="monto" aria-live="polite"></p>
          </label>

          <label>
            Categoría / Fuente
            <select id="categoria" name="categoria">
              <option value="" disabled selected>Selecciona una opción</option>
              <option value="salario">Salario / Sueldo</option>
              <option value="freelance">
                Freelance / Trabajos independientes
              </option>
              <option value="inversiones">Inversiones / Rendimientos</option>
              <option value="ventas">Ventas</option>
              <option value="otros">Otros</option>
            </select>
            <p class="error" data-error-for="categoria" aria-live="polite"></p>
          </label>

          <label>
            Fecha
            <input type="date" id="fecha" name="fecha" required />
            <p class="error" data-error-for="fecha" aria-live="polite"></p>
          </label>

          <label>
            Frecuencia
            <select id="frecuencia" name="frecuencia">
              <option value="puntual">Puntual (Único)</option>
              <option value="mensual">Mensual</option>
              <option value="quincenal">Quincenal</option>
            </select>
            <p class="error" data-error-for="frecuencia" aria-live="polite"></p>
          </label>

          <label class="full">
            Descripción / Nota
            <input
              type="text"
              id="descripcion"
              name="descripcion"
              placeholder="Ej: Bonificación de fin de mes"
            />
          </label>

          <div class="acciones">
            <button type="submit" class="btn btn-positivo">
              Guardar Ingreso
            </button>
            <a href="dashboard.html" class="btn btn-secundario">Cancelar</a>
          </div>
        </form>
      </section>
    </main>

    <footer class="pie-sitio">
      <p>
        Diseñado por
        <strong
          ><a href="https://github.com/Carlos-Curilef">Cafecito</a></strong
        >
      </p>
      <button
        type="button"
        id="boton-cafe"
        aria-label="Café secreto"
        title="Café secreto"
      >
        ☕
      </button>
    </footer>

    <div id="mostrador" class="mostrador oculto">
      <div class="escena-aroma">
        <div class="contenedor-aroma">
          <span class="aroma a-1"></span>
          <span class="aroma a-2"></span>
          <span class="aroma a-3"></span>
        </div>

        <div class="contenedor-taza">
          <div class="tapa-de-taza"></div>
          <div class="cuerpo-de-taza"></div>
        </div>

        <p class="mensaje-aroma">
          Vale por un café, ¡Suerte con estática 🌱! ☕✨
        </p>
      </div>
    </div>
    <script src="/javascript/app.js"></script>
  </body>
</html>
