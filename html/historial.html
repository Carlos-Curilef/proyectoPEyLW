<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/global.css" />
    <title>Historial - Finanzas</title>
  </head>
  <body>
    <header>
      <nav>
        <a href="dashboard.html">DASHBOARD</a>
        <a href="ingresos.html">INGRESOS</a>
        <a href="gastos.html">GASTOS</a>
        <a href="simulador.html">SIMULADOR</a>
        <a href="historial.html" class="activo">HISTORIAL</a>
        <a href="reportes.html">REPORTES</a>
      </nav>
    </header>

    <main>
      <!-- BLOQUE 1: Encabezado con Filtro -->
      <section>
        <header class="filtro">
          <div>
            <h1>Historial de Transacciones</h1>
            <p>Registro detallado de todos tus movimientos financieros.</p>
          </div>
          <label>
            <select id="filtro-tipo">
              <option value="todos">Todos los movimientos</option>
              <option value="ingreso">Solo Ingresos</option>
              <option value="gasto">Solo Gastos</option>
            </select>
          </label>
        </header>
      </section>

      <!-- BLOQUE 2: Tabla de Movimientos -->
      <section>
        <table>
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Tipo</th>
              <th>Categoría</th>
              <th>Descripción</th>
              <th>Monto</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-historial-body">
            <!-- Filas dinámicas generadas desde JavaScript -->
          </tbody>
        </table>
      </section>
    </main>

    <footer class="pie-sitio">
      <p>
        Diseñado por
        <strong
          ><a href="https://github.com/Carlos-Curilef">Cafecito</a></strong
        >
      </p>
      <button
        type="button"
        id="boton-cafe"
        aria-label="Café secreto"
        title="Café secreto"
      >
        ☕
      </button>
    </footer>

    <div id="mostrador" class="mostrador oculto">
      <div class="escena-aroma">
        <div class="contenedor-aroma">
          <span class="aroma a-1"></span>
          <span class="aroma a-2"></span>
          <span class="aroma a-3"></span>
        </div>

        <div class="contenedor-taza">
          <div class="tapa-de-taza"></div>
          <div class="cuerpo-de-taza"></div>
        </div>

        <p class="mensaje-aroma">
          Vale por un café, ¡Suerte con estática 🌱! ☕✨
        </p>
      </div>
    </div>
    <script src="/javascript/app.js"></script>
  </body>
</html>
